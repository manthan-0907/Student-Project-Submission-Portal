<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Project Submission Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Project Submission Portal</h1>
    <p>✨ Submit • Validate • Succeed ✨</p>
</header>

<main>
    <section class="form-section">
        <h2>Project Submission Form</h2>

        <!-- Student info -->
        <div class="field-group">
            <label for="name">👤 Student Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="field-group">
            <label for="roll">🔢 Roll Number</label>
            <input type="text" id="roll" placeholder="Enter roll number">
        </div>

        <div class="field-group">
            <label for="title">💡 Project Title</label>
            <input type="text" id="title" placeholder="Enter project title">
        </div>

        <div class="field-group">
            <label for="department">🏫 Department</label>
            <select id="department">
                <option value="">Select Department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Electrical</option>
                <option>Mechanical</option>
                <option>Civil</option>
                <option>Electronics</option>
            </select>
        </div>

        <div class="field-group">
            <label for="semester">📖 Semester</label>
            <select id="semester">
                <option value="">Select Semester</option>
                <option>Semester 1</option>
                <option>Semester 2</option>
                <option>Semester 3</option>
                <option>Semester 4</option>
                <option>Semester 5</option>
                <option>Semester 6</option>
                <option>Semester 7</option>
                <option>Semester 8</option>
            </select>
        </div>

        <!-- File upload -->
        <h3>📁 Upload Project</h3>
        <div class="upload-box">
            <label class="file-btn">
                📂 Choose File
                <input type="file" id="file" accept=".pdf,.zip,.doc,.docx,.ppt,.pptx" onchange="validateFile()">
            </label>
            <p id="fileMessage" class="msg"></p>
        </div>

        <p class="or">— OR —</p>

        <!-- Link input -->
        <h3>🔗 Project Link</h3>
        <input type="url" id="link" placeholder="https://github.com/your-project"
               oninput="validateLink()">
        <p id="linkMessage" class="msg"></p>

        <!-- Declaration -->
        <div class="declaration">
            <label>
                <input type="checkbox" id="agree">
                ✅ I confirm that this project is my original work and the information is correct.
            </label>
        </div>

        <button class="submit-btn" onclick="submitProject()">🚀 Submit Project</button>
        <p id="message" class="msg"></p>
    </section>
</main>

<!-- Success popup -->
<div id="popup" class="popup hidden">
    <div class="popup-content">
        <h2>✅ Submission Successful!</h2>
        <p>Your project has been submitted.</p>
        <button onclick="closePopup()">👍 Done</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
